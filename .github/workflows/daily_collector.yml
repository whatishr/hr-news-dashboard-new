name: Daily HR News Collector

on:
  schedule:
    - cron: '48 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests urllib3 beautifulsoup4 python-dotenv trafilatura google-genai

      - name: 뉴스 수집 스크립트 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python collector.py

      - name: 갱신된 데이터 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add hr_news.csv collector_status.json

          if git diff --cached --quiet; then
            echo "변경된 뉴스 데이터가 없습니다."
          else
            git commit -m "Auto: 매일 HR 뉴스 갱신"
            git push origin main
          fi
